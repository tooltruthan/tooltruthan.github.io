<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tru Thần — Quản lý Key Tool</title>
  <style>
    :root { --bg:#0f1419; --card:#1a222c; --ink:#e8eef4; --muted:#8a9aab; --acc:#c9a227; --ok:#3dba7a; --bad:#e85d5d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; color: var(--acc); }
    p.sub { color: var(--muted); margin: 0 0 20px; font-size: .92rem; }
    .card { background: var(--card); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; border: 1px solid #2a3542; }
    label { display:block; font-size:.8rem; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f1720; color:var(--ink); }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width:640px){ .row { grid-template-columns:1fr; } }
    button { margin-top:14px; padding:10px 16px; border:0; border-radius:8px; background:var(--acc); color:#1a1200; font-weight:700; cursor:pointer; }
    button.secondary { background:#334155; color:var(--ink); margin-left:8px; }
    button.danger { background:var(--bad); color:#fff; }
    button.small { margin-top:0; padding:6px 10px; font-size:.78rem; margin-left:0; margin-right:6px; }
    td.actions { white-space:nowrap; }
    .dev-list { margin:0; padding:0; list-style:none; font-size:.78rem; line-height:1.4; }
    .dev-list li { margin:0 0 4px; }
    .dev-list code { font-size:.76rem; color: var(--acc); }
    .dev-list .nv { color: var(--ink); }
    .dev-list .muted { color: var(--muted); }
    .dev-count { color: var(--muted); font-size:.75rem; margin-bottom:4px; }
    table { width:100%; border-collapse: collapse; font-size:.85rem; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #2a3542; vertical-align:top; }
    th { color: var(--muted); font-weight:600; }
    .msg { margin-top:12px; padding:10px 12px; border-radius:8px; background:#0f1720; white-space:pre-wrap; word-break:break-all; }
    .msg.ok { border-left: 3px solid var(--ok); }
    .msg.err { border-left: 3px solid var(--bad); }
    .hint { font-size:.8rem; color: var(--muted); margin-top:8px; }
    a { color: var(--acc); }
    .rules { font-size:.82rem; color: var(--muted); margin: 8px 0 0; line-height:1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Quản lý Key — Tru Thần  Tool</h1>

    <div class="card">
      <label>API Worker URL</label>
      <input id="api" value="https://truthan-license-api8.0396101452toan.workers.dev" />
      <label>Token</label>
      <input id="token" type="password" placeholder="Dán ADMIN_TOKEN" autocomplete="off" />
      <button type="button" onclick="saveCfg()">Lưu cấu hình</button>
      <button type="button" class="secondary" onclick="loadList()">Tải danh sách key</button>
    </div>

    <div class="card">
      <strong>Tạo key mới</strong>
      <p class="rules">
        · Thường: 1 quyền + hạn 1h/3h/12h/24h/48h/72h.<br />
        · VIP: All quyền + hạn giờ.<br />
        · Chí tôn: All quyền , không hết hạn.
      </p>
      <div class="row">
        <div>
          <label>Loại</label>
          <select id="tier" onchange="syncForm()">
            <option value="thuong">Thường</option>
            <option value="vip">VIP</option>
            <option value="chiton">Chí tôn</option>
          </select>
        </div>
        <div id="hoursWrap">
          <label>Hạn sử dụng</label>
          <select id="hours">
            <option value="1" selected>1 giờ</option>
            <option value="3">3 giờ</option>
            <option value="12">12 giờ</option>
            <option value="24">24 giờ</option>
            <option value="48">48 giờ</option>
            <option value="72">72 giờ</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div id="permsWrap">
          <label>Quyền</label>
          <select id="perms">
            <option value="pb">pb — Auto Phó bản</option>
            <option value="nv">nv — Auto Nhiệm vụ</option>
            <option value="lc">lc — Train Linh Châu</option>
            <option value="train">train — Treo theo vị trí</option>
            <option value="tho">tho — Auto thỏ</option>
            <option value="pk">pk — Auto PK</option>
            <option value="boss">boss — Auto Boss</option>
          </select>
          <p id="permsHint" class="hint"></p>
        </div>
        <div>
          <label>Số máy tối đa</label>
          <input id="maxd" type="number" value="1" min="1" />
        </div>
      </div>
      <label>Ghi chú</label>
      <input id="note" placeholder="vd: Toan — test" />
      <button type="button" onclick="createKey()">Tạo key</button>
      <div id="createMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
      <strong>Danh sách key</strong>
      <div style="overflow-x:auto; margin-top:10px">
        <table>
          <thead>
            <tr><th>Key</th><th>Loại</th><th>Quyền</th><th>Hết hạn</th><th>Mã máy / Nhân vật</th><th></th></tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="6" style="color:var(--muted)">Chưa tải.</td></tr></tbody>
        </table>
      </div>
    </div>

    <p class="hint"><a href="../index.html">← Về trang chủ web</a></p>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function saveCfg() {
      localStorage.setItem("tt_lic_api", $("api").value.trim());
      localStorage.setItem("tt_lic_tok", $("token").value.trim());
      show("createMsg", "Đã lưu cấu hình trên trình duyệt này.", true);
    }
    function loadCfg() {
      $("api").value = localStorage.getItem("tt_lic_api") || $("api").value;
      $("token").value = localStorage.getItem("tt_lic_tok") || "";
    }
    function syncForm() {
      const tier = $("tier").value;
      const hoursWrap = $("hoursWrap");
      const perms = $("perms");
      const hint = $("permsHint");
      if (tier === "chiton") {
        hoursWrap.style.opacity = "0.45";
        hoursWrap.style.pointerEvents = "none";
        perms.disabled = true;
        hint.textContent = "Chí tôn: All Quyền, không hết hạn.";
      } else if (tier === "vip") {
        hoursWrap.style.opacity = "1";
        hoursWrap.style.pointerEvents = "";
        perms.disabled = true;
        hint.textContent = "VIP:  All Quyền + hạn giờ.";
      } else {
        hoursWrap.style.opacity = "1";
        hoursWrap.style.pointerEvents = "";
        perms.disabled = false;
        hint.textContent = "Thường: chọn 1 quyền + hạn giờ.";
      }
    }
    function show(id, text, ok) {
      const el = $(id);
      el.style.display = "block";
      el.className = "msg " + (ok ? "ok" : "err");
      el.textContent = text;
    }
    async function api(path, opts = {}) {
      const base = $("api").value.replace(/\/$/, "");
      const headers = Object.assign({ "Content-Type": "application/json", "X-Admin-Token": $("token").value.trim() }, opts.headers || {});
      const res = await fetch(base + path, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.msg || ("HTTP " + res.status));
      return data;
    }
    async function createKey() {
      try {
        saveCfg();
        const tier = $("tier").value;
        const body = {
          tier,
          max_devices: Number($("maxd").value),
          note: $("note").value,
        };
        if (tier !== "chiton") body.hours = Number($("hours").value);
        if (tier === "thuong") body.perms = $("perms").value;
        const data = await api("/api/admin/create", {
          method: "POST",
          body: JSON.stringify(body),
        });
        const exp = data.permanent || Number(data.expires_at) <= 0
          ? "Không hạn"
          : new Date(data.expires_at).toLocaleString();
        show("createMsg", "KEY: " + data.key + "\nLoại: " + data.tier + "\nQuyền: " + data.perms + "\nHết hạn: " + exp, true);
        loadList();
      } catch (e) {
        show("createMsg", String(e.message || e), false);
      }
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function deviceCell(list, maxDevices) {
      const n = list.length;
      const head = '<div class="dev-count">' + n + "/" + maxDevices + " máy</div>";
      if (!n) return head + '<span class="muted">Chưa gắn máy (JAR chưa check key)</span>';
      const items = list.map((b) => {
        const dev = esc(b.device || "?");
        const nv = (b.char_name || "").trim();
        const nvHtml = nv ? '<span class="nv">' + esc(nv) + "</span>" : '<span class="muted">(chưa có NV)</span>';
        const seen = b.last_seen ? new Date(Number(b.last_seen)).toLocaleString() : "";
        return "<li><code title=\"Mã máy từ JAR\">" + dev + "</code> · " + nvHtml +
          (seen ? '<br><span class="muted">online: ' + esc(seen) + "</span>" : "") +
          "</li>";
      }).join("");
      return head + '<ul class="dev-list">' + items + "</ul>";
    }
    async function loadList() {
      try {
        const data = await api("/api/admin/list");
        const tb = $("tbody");
        const canDelete = !!data.can_delete;
        const binds = {};
        (data.bindings || []).forEach((b) => {
          if (!binds[b.key]) binds[b.key] = [];
          binds[b.key].push(b);
        });
        if (!data.licenses || !data.licenses.length) {
          tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Chưa có key.</td></tr>';
          return;
        }
        tb.innerHTML = data.licenses.map((l) => {
          const permanent = String(l.tier).toLowerCase() === "chiton" || Number(l.expires_at) <= 0;
          const exp = permanent ? "Không hạn" : new Date(Number(l.expires_at)).toLocaleString();
          const dead = l.disabled ? " (KHÓA)" : "";
          const devices = binds[l.key] || [];
          const delBtn = canDelete
            ? '<button type="button" class="secondary small" onclick="removeKey(\'' + esc(l.key) + '\')">Xóa</button>'
            : "";
          return "<tr><td><code>" + esc(l.key) + "</code>" + dead + "</td><td>" + esc(l.tier) +
            "</td><td>" + esc(l.perms || "") + "</td><td>" + exp +
            "</td><td>" + deviceCell(devices, l.max_devices) +
            '</td><td class="actions">' +
            '<button type="button" class="danger small" onclick="revoke(\'' + esc(l.key) + '\')">Khóa</button>' +
            delBtn +
            "</td></tr>";
        }).join("");
      } catch (e) {
        $("tbody").innerHTML = '<tr><td colspan="6" style="color:var(--bad)">' + esc(e.message || e) + "</td></tr>";
      }
    }
    async function revoke(key) {
      if (!confirm("Khóa key " + key + "?")) return;
      try {
        await api("/api/admin/revoke", { method: "POST", body: JSON.stringify({ key }) });
        loadList();
      } catch (e) {
        alert(e.message || e);
      }
    }
    async function removeKey(key) {
      if (!confirm("Xóa hẳn key " + key + "?\nKhông hoàn tác được.")) return;
      try {
        await api("/api/admin/delete", { method: "POST", body: JSON.stringify({ key }) });
        loadList();
      } catch (e) {
        alert(e.message || e);
      }
    }
    loadCfg();
    syncForm();
  </script>
</body>
</html>
